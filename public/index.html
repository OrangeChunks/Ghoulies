<!DOCTYPE html>
<html>
<head>
<title>Ghoulies</title>

<style>
body {
  background:#0b3d2e;
  color:white;
  font-family:Arial;
}

#container{
  display:flex;
}

#game{
  flex:3;
  text-align:center;
}

#scores{
  flex:1;
  padding:20px;
  border-left:2px solid white;
}

.card{
  width:80px;
  cursor:pointer;
}

#hand,#opponent{
  display:flex;
  justify-content:center;
  gap:10px;
}
</style>
</head>

<body>

<div id="container">

<div id="game">

<h1>Ghoulies</h1>

<div id="board">
<img id="deck" src="/cards/back.png" class="card">
<div id="discard"></div>
</div>

<h2 id="status"></h2>

<div id="drawn"></div>

<button id="ghouliesBtn">Call Ghoulies</button>

<h3>Opponent</h3>
<div id="opponent"></div>

<h3>Your Hand</h3>
<div id="hand"></div>

</div>

<div id="scores"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
