<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ghoulies</title>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

#status{
  padding:10px;
  font-size:20px;
}

#scores{
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin:16px;
}

.card{
  width:70px;
  margin:4px;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.08);
}

#deck,#discard{
  width:85px;
  height:110px;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  cursor:pointer;
}

#hand,#opponentHand{
  min-height:110px;
  padding:10px;
}

#restartBtn{
  display:none;
  padding:10px;
  margin:10px;
}

@media(max-width:600px){

  .card{
    width:55px;
  }

  #deck,#discard{
    width:70px;
    height:95px;
  }
}

</style>
</head>

<body>

<div id="status"></div>

<div id="scores"></div>

<button id="restartBtn">
  Play Again
</button>

<!-- OPPONENT -->
<div class="row">
  <div id="opponentHand"></div>
</div>

<!-- CENTER -->
<div class="row">
  <div id="deck">
    Deck
  </div>

  <div id="discard"></div>
</div>

<!-- PLAYER -->
<div class="row">
  <div id="hand"></div>
</div>

<div id="pending"></div>

<div class="row">
  <button id="ghouliesBtn">
    Call Ghoulies
  </button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
