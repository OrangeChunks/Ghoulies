<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghoulies</title>

<style>
body{
  background:#0b3d2e;
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

#table{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  height:100vh;
  padding:10px;
}

.hand{
  display:flex;
  justify-content:center;
  gap:8px;
}

.card{
  width:70px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{transform:scale(1.1);}

#center{
  display:flex;
  justify-content:center;
  gap:40px;
}

button{
  padding:12px 18px;
  margin-top:10px;
}

#scores{
  position:absolute;
  right:10px;
  top:10px;
}
</style>
</head>

<body>

<div id="table">

  <h3>Opponent</h3>
  <div id="opponentHand" class="hand"></div>

  <div id="center">
    <img id="deck" src="/cards/back.png" class="card">
    <div id="discard"></div>
  </div>

  <h2 id="status"></h2>

  <div id="drawn"></div>

  <h3>You</h3>
  <div id="hand" class="hand"></div>

  <button id="ghouliesBtn">Call Ghoulies 👻</button>

  <div id="scores"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
