<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghoulies</title>

<style>
body{
  background:#0b3d2e;
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

/* MAIN LAYOUT */
#table{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  height:100vh;
  padding:15px;
}

/* HANDS */
.hand{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

/* CARD STYLE */
.card{
  width:70px;
  transition:0.2s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.1);
}

/* CENTER AREA */
#centerRow{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  margin:20px 0;
}

/* BUTTON */
button{
  padding:14px 20px;
  font-size:16px;
  margin-top:15px;
}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

/* SCORE PANEL */
#scores{
  position:absolute;
  right:10px;
  top:10px;
  background:rgba(0,0,0,0.3);
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div id="table">

  <!-- OPPONENT -->
  <div>
    <h3>Opponent</h3>
    <div id="opponentHand" class="hand"></div>
  </div>

  <!-- CENTER (DECK + DISCARD) -->
  <div id="centerRow">
    <img id="deck" src="/cards/back.png" class="card">
    <div id="discard"></div>
  </div>

  <h2 id="status"></h2>

  <div id="drawn"></div>

  <!-- YOUR HAND -->
  <div>
    <h3>You</h3>
    <div id="hand" class="hand"></div>
  </div>

  <!-- BUTTON -->
  <div>
    <button id="ghouliesBtn">Call Ghoulies 👻</button>
  </div>

  <div id="scores"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
