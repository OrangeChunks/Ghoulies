<!DOCTYPE html>
<html>
<head>
  <title>Ghoulies 🎴</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Ghoulies 🎴</h1>

  <!-- =========================
       BOARD (DECK + DISCARD)
  ========================== -->
  <div id="board">

    <!-- FACE DOWN DECK -->
    <div id="deck" class="card-back"></div>

    <!-- DISCARD PILE -->
    <div id="discard"></div>

  </div>

  <!-- =========================
       STATUS
  ========================== -->
  <h2 id="status">Loading...</h2>

  <!-- =========================
       PLAYER HAND
  ========================== -->
  <div id="hand"></div>

  <!-- =========================
       SOCKET + GAME SCRIPTS
       ⚠️ ORDER IS CRITICAL
  ========================== -->

  <!-- Socket.IO client MUST load first -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Your game logic -->
  <script src="game.js"></script>

</body>
</html>
