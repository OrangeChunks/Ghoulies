<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghoulies</title>

<style>
body{
  background:#0b3d2e;
  color:white;
  font-family:Arial;
  margin:0;
}

#container{
  display:flex;
  flex-direction:column;
}

@media(min-width:700px){
  #container{flex-direction:row;}
}

#game{flex:3;text-align:center;}

#scores{
  flex:1;
  border-left:2px solid white;
  padding:15px;
}

.card{
  width:70px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{transform:scale(1.1);}

button{
  padding:12px;
  font-size:16px;
  margin:10px;
}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div id="container">

<div id="game">

<h1>Ghoulies</h1>

<div>
<img id="deck" src="/cards/back.png" class="card">
<div id="discard"></div>
</div>

<h2 id="status"></h2>

<div id="drawn"></div>

<button id="ghouliesBtn">Call Ghoulies 👻</button>

<h3>Opponent</h3>
<div id="opponent"></div>

<h3>Your Hand</h3>
<div id="hand"></div>

</div>

<div id="scores"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
