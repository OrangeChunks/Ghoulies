<!-- index.html -->
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ghoulies</title>

<style>

/* ── base ──────────────────────────────────────────────────────────────── */

body{
  margin:0;
  background: radial-gradient(circle at top,#222,#111);
  color:white;
  text-align:center;
  font-family:Arial;
  overflow-x:hidden;
  transition: background 0.4s;
}

.snapFlash    { background:#1d3b1d !important; }
.ghouliesFlash{ background:#4b0000 !important; }

/* ── status / scores ───────────────────────────────────────────────────── */

#status{
  padding:12px;
  font-size:22px;
  font-weight:bold;
  letter-spacing:1px;
  text-shadow:0 0 10px #000;
  transition: color 0.3s;
}

#scores{
  margin-bottom:12px;
  font-size:18px;
}

/* ── layout rows ───────────────────────────────────────────────────────── */

.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin:16px;
}

/* ── hand containers ───────────────────────────────────────────────────── */

#hand,
#opponentHand{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  min-height:120px;
  width:100%;
  max-width:100vw;
  padding:12px;
  box-sizing:border-box;
  overflow-x:auto;
  border-radius:16px;
  transition: box-shadow 0.3s;
}

/* ── card ──────────────────────────────────────────────────────────────── */

.card{
  width:70px;
  border-radius:6px;
  /* Use transform for hover — compositor-only, no reflow */
  transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  cursor:pointer;
  user-select:none;
  will-change: transform;
}

.card:hover{
  transform: translateY(-8px) scale(1.08);
}

.card.swapping{
  opacity:0.2;
  transform: scale(0.9);
}

.activeTurn{
  box-shadow: 0 0 32px #00ff88;
}

/* ── last-turn pulse on player's hand ─────────────────────────────────── */

@keyframes lastTurnPulseAnim{
  0%,100% { box-shadow: 0 0 0   #ff2222; }
  50%     { box-shadow: 0 0 40px #ff2222, 0 0 80px #ff000066; }
}

.lastTurnPulse{
  animation: lastTurnPulseAnim 0.7s ease-in-out infinite;
}

/* ── last-turn overlay banner ─────────────────────────────────────────── */

.lastTurnBanner{
  position:absolute;
  left:50%;
  top:38%;
  transform: translate(-50%,-50%) scale(0.4);
  font-size:52px;
  font-weight:900;
  color:#ff2222;
  text-shadow: 0 0 30px #ff0000, 0 0 60px #ff000088;
  letter-spacing:3px;
  white-space:nowrap;
  animation: lastTurnPop 3.2s forwards;
  pointer-events:none;
}

@keyframes lastTurnPop{
  0%   { opacity:0; transform: translate(-50%,-50%) scale(0.4); }
  12%  { opacity:1; transform: translate(-50%,-50%) scale(1.15); }
  20%  { transform: translate(-50%,-50%) scale(1.0); }
  75%  { opacity:1; transform: translate(-50%,-50%) scale(1.0); }
  100% { opacity:0; transform: translate(-50%,-50%) scale(0.8); }
}

/* ── special card glows ────────────────────────────────────────────────── */

.tenGlow{
  box-shadow: 0 0 20px gold;
  border-radius:8px;
}

.bigCard{
  width:90px;
}

/* ── discard pop animation ─────────────────────────────────────────────── */

.pop{
  animation: pop 0.22s cubic-bezier(0.22,0.61,0.36,1);
}

@keyframes pop{
  0%   { transform:scale(0.55); }
  65%  { transform:scale(1.08); }
  100% { transform:scale(1);    }
}

/* ── pending-card flip ─────────────────────────────────────────────────── */

.flip{
  animation: flipCard 0.45s cubic-bezier(0.22,0.61,0.36,1);
}

@keyframes flipCard{
  0%   { transform: rotateY(90deg) scale(0.8); }
  100% { transform: rotateY(0deg)  scale(1);   }
}

/* ── deck shake ────────────────────────────────────────────────────────── */

.deckShake{
  animation: shake 0.3s ease;
}

@keyframes shake{
  0%,100% { transform:translateX(0);  }
  25%     { transform:translateX(-5px); }
  75%     { transform:translateX(5px);  }
}

/* ── deck / discard piles ──────────────────────────────────────────────── */

#deck,
#discard{
  width:90px;
  height:120px;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  cursor:pointer;
  border-radius:12px;
  overflow:hidden;
  box-shadow: 0 8px 18px rgba(0,0,0,0.5);
  transition: transform 0.15s ease;
}

#deck:hover,
#discard:hover{
  transform:scale(1.05);
}

#deck img,
#discard img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ── buttons ───────────────────────────────────────────────────────────── */

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  background:#222;
  color:white;
  transition: transform 0.15s ease, background 0.15s ease;
}

button:hover{
  transform:scale(1.06);
  background:#333;
}

#ghouliesBtn       { background:#7a0000; }
#ghouliesBtn:hover { background:#aa0000; }
#resetBtn          { background:#444; }
#restartBtn        { display:none; }

/* ── fx layer ──────────────────────────────────────────────────────────── */

#fxLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:9999;
}

/* ── flying card ───────────────────────────────────────────────────────── */
/* Positioned with transform:translate() — compositor-only, zero reflow.    */

.flyingCard{
  position:absolute;
  left:0; top:0;
  width:80px;
  border-radius:5px;
  pointer-events:none;
  will-change:transform,opacity;
  /* transition applied by JS after first paint */
}

/* ── effect text pop ───────────────────────────────────────────────────── */

.effectText{
  position:absolute;
  left:50%;
  top:50%;
  transform: translate(-50%,-50%);
  font-size:44px;
  font-weight:bold;
  animation: effectPop 1.1s forwards;
  text-shadow:0 0 20px #000;
  pointer-events:none;
}

@keyframes effectPop{
  0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4); }
  18%  { opacity:1; transform:translate(-50%,-50%) scale(1.25); }
  35%  { transform:translate(-50%,-50%) scale(1.0); }
  78%  { opacity:1; }
  100% { opacity:0; transform:translate(-50%,-50%) scale(0.9); }
}

/* ── opponent pending zone ─────────────────────────────────────────────── */

#opponentPending{
  position:absolute;
  top:20%;
  right:10%;
  width:80px;
  height:120px;
}

/* ── mobile ────────────────────────────────────────────────────────────── */

@media(max-width:600px){

  .card    { width:55px; }
  .bigCard { width:75px; }

  #deck,
  #discard{
    width:72px;
    height:98px;
  }

  button{
    font-size:14px;
    padding:10px 14px;
  }

  #status{ font-size:18px; }

  .lastTurnBanner{ font-size:36px; }
  .effectText    { font-size:32px; }
}

</style>
</head>

<body>

<div id="status"></div>
<div id="scores"></div>

<button id="restartBtn">Play Again</button>

<!-- OPPONENT -->
<div id="opponentPending">
  <img
    id="opponentPendingCard"
    class="card"
    src="/cards/back.png"
    style="display:none;"
  >
</div>

<div id="opponentHand"></div>

<!-- CENTER -->
<div class="row">
  <div id="deck">
    <img src="/cards/back.png" alt="Deck">
  </div>
  <div id="discard"></div>
</div>

<!-- PLAYER -->
<div id="hand"></div>

<!-- PENDING -->
<div id="pending"></div>

<!-- ACTIONS -->
<div class="row">
  <button id="ghouliesBtn">Call Ghoulies</button>
  <button id="noSwapBtn" style="display:none;">No Swap</button>
  <button id="resetBtn">Reset Game</button>
</div>

<div id="fxLayer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
