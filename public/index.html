<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ghoulies</title>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

#status{
  padding:10px;
  font-size:20px;
  font-weight:bold;
}

#scores{
  margin-bottom:10px;
}

/* ROWS */
.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin:16px;
}

/* HANDS */
#hand,
#opponentHand{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  min-height:120px;
  width:100%;
  max-width:100vw;
  padding:10px;
  box-sizing:border-box;
  overflow-x:auto;
}

/* CARDS */
.card{
  width:70px;
  transition:0.2s;
  cursor:pointer;
  user-select:none;
}

.card:hover{
  transform:scale(1.08);
}

/* ACTIVE TURN GLOW */
.activeTurn{
  box-shadow:0 0 20px #00ff88;
  border-radius:10px;
}

/* TEN SWAP GLOW */
.tenGlow{
  box-shadow:0 0 20px gold;
  border-radius:10px;
}

/* FLIP */
.flip{
  animation:flipCard 0.6s ease;
}

@keyframes flipCard{

  0%{
    transform:rotateY(0deg);
  }

  50%{
    transform:rotateY(90deg);
  }

  100%{
    transform:rotateY(0deg);
  }
}

/* DECKS */
#deck,
#discard{
  width:85px;
  height:110px;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
}

#deck img,
#discard img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BUTTONS */
button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

#restartBtn{
  display:none;
}

#resetBtn{
  background:#ff4444;
  color:white;
}

/* MOBILE */
@media(max-width:600px){

  .card{
    width:55px;
  }

  #deck,
  #discard{
    width:70px;
    height:95px;
  }

  #hand,
  #opponentHand{
    gap:6px;
  }

  button{
    font-size:14px;
    padding:8px 12px;
  }

  #status{
    font-size:18px;
  }
}

</style>
</head>

<body>

<div id="status"></div>

<div id="scores"></div>

<button id="restartBtn">
  Play Again
</button>

<!-- OPPONENT -->
<div id="opponentHand"></div>

<!-- CENTER -->
<div class="row">

  <div id="deck">
    <img
      src="/cards/back.png"
      alt="Deck"
    >
  </div>

  <div id="discard"></div>

</div>

<!-- PLAYER -->
<div id="hand"></div>

<!-- PENDING -->
<div id="pending"></div>

<!-- ACTIONS -->
<div class="row">

  <button id="ghouliesBtn">
    Call Ghoulies
  </button>

  <button id="resetBtn">
    Reset Game
  </button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
