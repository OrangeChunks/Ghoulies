<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ghoulies</title>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
  overflow-x:hidden;
}

#status{
  padding:10px;
  font-size:20px;
  font-weight:bold;
}

#scores{
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin:16px;
}

#hand,
#opponentHand{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  min-height:120px;
  width:100%;
  padding:10px;
}

.card{
  width:70px;
  transition:0.2s;
  cursor:pointer;
  user-select:none;
}

.card.swapping{
  opacity:0.25;
}

.card:hover{
  transform:scale(1.08);
}

.cardWrap{
  position:relative;
  display:inline-block;
}

.swapMarker{
  position:absolute;
  top:-8px;
  right:-8px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:gold;
  color:black;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 0 15px gold;
  animation:swapPulse 0.8s infinite alternate;
  z-index:20;
}

@keyframes swapPulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.15);
  }
}

#deck,
#discard{
  width:85px;
  height:110px;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  cursor:pointer;
  border-radius:8px;
  overflow:hidden;
}

#deck img,
#discard img{
  width:100%;
  height:100%;
  object-fit:cover;
}

button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

#restartBtn{
  display:none;
}

#fxLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:9999;
}

.flyingCard{
  position:fixed;
  width:70px;
  transform:translate(-50%,-50%);
  transition:
    left 0.55s ease,
    top 0.55s ease,
    transform 0.55s ease;
}

.effectText{
  position:fixed;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:48px;
  font-weight:bold;
  text-shadow:0 0 20px currentColor;
  animation:effectPop 1s forwards;
}

@keyframes effectPop{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.5);
  }

  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.2);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1);
  }
}

.deckShake{
  animation:deckShake 0.3s;
}

@keyframes deckShake{

  0%{ transform:translateX(0); }
  25%{ transform:translateX(-5px); }
  50%{ transform:translateX(5px); }
  75%{ transform:translateX(-5px); }
  100%{ transform:translateX(0); }
}

.snapFlash{
  animation:snapFlash 0.2s;
}

@keyframes snapFlash{

  from{
    background:#00ff88;
  }

  to{
    background:#111;
  }
}

.activeTurn{
  box-shadow:0 0 30px #00ff88;
  border-radius:12px;
}

.tenGlow{
  box-shadow:0 0 20px gold;
}

@media(max-width:600px){

  .card{
    width:55px;
  }

  #deck,
  #discard{
    width:70px;
    height:95px;
  }

  #hand,
  #opponentHand{
    gap:6px;
  }

  .effectText{
    font-size:32px;
  }
}

</style>
</head>

<body>

<div id="fxLayer"></div>

<div id="status"></div>

<div id="scores"></div>

<button id="restartBtn">
  Play Again
</button>

<div id="opponentHand"></div>

<div id="opponentPending"></div>

<div class="row">

  <div id="deck">
    <img
      src="/cards/back.png"
      alt="Deck"
    >
  </div>

  <div id="discard"></div>

</div>

<div id="hand"></div>

<div id="pending"></div>

<div class="row">

  <button id="ghouliesBtn">
    Call Ghoulies
  </button>

  <button id="noSwapBtn" style="display:none;">
    No Swap
  </button>

  <button id="resetBtn">
    Reset Game
  </button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
