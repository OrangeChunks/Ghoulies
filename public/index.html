<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghoulies</title>

<style>
body{
  background:#0b3d2e;
  color:white;
  font-family:Arial;
  margin:0;
}

#table{
  display:flex;
  flex-direction:column;
  height:100vh;
  justify-content:space-between;
  align-items:center;
  padding:10px;
}

/* CENTER AREA */
#center{
  display:flex;
  gap:20px;
  align-items:center;
  justify-content:center;
}

/* PLAYERS */
#opponentArea,#playerArea{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

/* HANDS */
.hand{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CARDS */
.card{
  width:60px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.1);
}

/* BUTTON */
button{
  padding:12px;
  font-size:16px;
  margin:10px;
}

button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}

#scores{
  position:absolute;
  right:10px;
  top:10px;
  background:rgba(0,0,0,0.3);
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="table">

<!-- OPPONENT -->
<div id="opponentArea">
  <h3>Opponent</h3>
  <div id="opponentHand" class="hand"></div>
</div>

<!-- CENTER -->
<div id="center">

  <img id="deck" src="/cards/back.png" class="card">

  <div id="discard"></div>

</div>

<h2 id="status"></h2>

<div id="drawn"></div>

<button id="ghouliesBtn">Call Ghoulies 👻</button>

<!-- PLAYER -->
<div id="playerArea">
  <h3>You</h3>
  <div id="hand" class="hand"></div>
</div>

<div id="scores"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
