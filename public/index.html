<!-- index.html -->
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Ghoulies</title>

<style>

body{
  margin:0;
  background:
    radial-gradient(circle at top,#222,#111);
  color:white;
  text-align:center;
  font-family:Arial;
  overflow-x:hidden;
  transition:0.2s;
}

.snapFlash{
  background:#1d3b1d !important;
}

.ghouliesFlash{
  background:#4b0000 !important;
}

#status{
  padding:12px;
  font-size:22px;
  font-weight:bold;
  letter-spacing:1px;
  text-shadow:0 0 10px #000;
}

#scores{
  margin-bottom:12px;
  font-size:18px;
}

.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin:16px;
}

#hand,
#opponentHand{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  min-height:120px;
  width:100%;
  max-width:100vw;
  padding:12px;
  box-sizing:border-box;
  overflow-x:auto;
  transition:0.3s;
}

.card{
  width:70px;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
  cursor:pointer;
  user-select:none;
}

.card:hover{
  transform:
    translateY(-8px)
    scale(1.08);
}

.activeTurn{
  box-shadow:
    0 0 30px #00ff88;
  border-radius:16px;
}

.tenGlow{
  box-shadow:
    0 0 20px gold;
  border-radius:10px;
}

.bigCard{
  width:90px;
}

.pop{
  animation:pop 0.2s ease;
}

@keyframes pop{
  0%{
    transform:scale(0.6);
  }
  100%{
    transform:scale(1);
  }
}

.flip{
  animation:flipCard 0.5s ease;
}

@keyframes flipCard{

  0%{
    transform:rotateY(90deg);
  }

  100%{
    transform:rotateY(0deg);
  }
}

.deckShake{
  animation:shake 0.3s;
}

@keyframes shake{

  0%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-5px);
  }

  50%{
    transform:translateX(5px);
  }

  75%{
    transform:translateX(-5px);
  }

  100%{
    transform:translateX(0);
  }
}

#deck,
#discard{
  width:90px;
  height:120px;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  cursor:pointer;
  border-radius:12px;
  overflow:hidden;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.5);
}

#deck:hover,
#discard:hover{
  transform:scale(1.04);
}

#deck img,
#discard img{
  width:100%;
  height:100%;
  object-fit:cover;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;

  background:#222;
  color:white;

  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  background:#333;
}

#ghouliesBtn{
  background:#7a0000;
}

#ghouliesBtn:hover{
  background:#aa0000;
}

#resetBtn{
  background:#444;
}

#restartBtn{
  display:none;
}

#fxLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:9999;
}

.flyingCard{
  position:absolute;
  width:80px;
  transition:
    left 0.5s ease,
    top 0.5s ease,
    transform 0.5s ease,
    opacity 0.5s ease;
  z-index:9999;
}

.effectText{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:42px;
  font-weight:bold;
  animation:effectPop 1s forwards;
  text-shadow:0 0 20px black;
}

@keyframes effectPop{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(0.5);
  }

  20%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.2);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

@media(max-width:600px){

  .card{
    width:55px;
  }

  .bigCard{
    width:75px;
  }

  #deck,
  #discard{
    width:72px;
    height:98px;
  }

  button{
    font-size:14px;
    padding:10px 14px;
  }

  #status{
    font-size:18px;
  }
}

</style>
</head>

<body>

<div id="status"></div>

<div id="scores"></div>

<button id="restartBtn">
  Play Again
</button>

<!-- OPPONENT -->
<div id="opponentHand"></div>

<!-- CENTER -->
<div class="row">

  <div id="deck">
    <img
      src="/cards/back.png"
      alt="Deck"
    >
  </div>

  <div id="discard"></div>

</div>

<!-- PLAYER -->
<div id="hand"></div>

<!-- PENDING -->
<div id="pending"></div>

<!-- ACTIONS -->
<div class="row">

  <button id="ghouliesBtn">
    Call Ghoulies
  </button>

  <button id="noSwapBtn" style="display:none;">
    No Swap
  </button>

  <button id="resetBtn">
    Reset Game
  </button>

</div>

<div id="fxLayer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
