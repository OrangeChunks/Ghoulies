<!DOCTYPE html>
<html>
<head>
  <title>Ghoulies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="status"></h2>

<div id="opponentSection">
  <h3>Opponent</h3>
  <div id="opponentHand"></div>
</div>

<div id="center">
  <div id="deck"><img src="/cards/back.png"></div>
  <div id="discard"></div>
</div>

<div id="yourSection">
  <h3>You</h3>
  <div id="hand"></div>
</div>

<button id="ghouliesBtn">Call Ghoulies</button>

<div id="scores"></div>

<div id="drawn"></div>

<div id="endScreen" class="hidden">
  <div id="endContent">
    <h1 id="endText"></h1>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
