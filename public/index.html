<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Ghoulies</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: white;
    text-align: center;
  }

  #status {
    padding: 10px;
    font-size: 20px;
    font-weight: bold;
  }

  #scores {
    margin: 5px;
    font-size: 16px;
  }

  #restartBtn {
    display: none;
    margin: 10px auto;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }

  .row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 10px;
    flex-wrap: wrap;
  }

  #hand, #opponentHand {
    min-height: 120px;
  }

  .card {
    width: 70px;
    height: auto;
    margin: 5px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .card:hover {
    transform: scale(1.1);
  }

  #deck, #discard {
    width: 80px;
    height: 110px;
    border: 2px solid white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  #deck {
    background: #222;
  }

  #discard {
    background: #111;
  }

  /* MOBILE FIX */
  @media (max-width: 600px) {
    .card {
      width: 55px;
    }

    #status {
      font-size: 18px;
    }
  }
</style>
</head>

<body>

<div id="status">Connecting...</div>

<div id="scores"></div>

<button id="restartBtn">Play Again</button>

<!-- OPPONENT -->
<div class="row">
  <div id="opponentHand"></div>
</div>

<!-- CENTER AREA -->
<div class="row">
  <div id="deck">Deck</div>
  <div id="discard">Discard</div>
</div>

<!-- YOUR HAND -->
<div class="row">
  <div id="hand"></div>
</div>

<!-- ACTIONS -->
<div class="row">
  <button id="ghouliesBtn">Call Ghoulies</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
