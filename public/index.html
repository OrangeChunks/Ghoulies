<!DOCTYPE html>
<html>
<head>
  <title>Ghoulies 🎴</title>

  <style>
    body {
      background: #0b3d2e;
      color: white;
      text-align: center;
      font-family: Arial;
    }

    #board {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px;
    }

    .card {
      width: 80px;
      cursor: pointer;
    }

    .card-back {
      width: 80px;
      height: 120px;
      background: black;
      border-radius: 8px;
    }

    #hand, #opponent {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
    }

    #scores {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>Ghoulies 🎴</h1>

<div id="board">
  <img id="deck" src="/cards/back.png" class="card">
  <div id="discard"></div>
</div>

<h2 id="status">Connecting...</h2>

<button id="ghouliesBtn">Call Ghoulies 👻</button>

<div id="scores"></div>

<h3>Opponent</h3>
<div id="opponent"></div>

<h3>Your Hand</h3>
<div id="hand"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
