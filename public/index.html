<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ghoulies</title>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

#status{
  padding:10px;
  font-size:20px;
  font-weight:bold;
}

#scores{
  margin-bottom:10px;
}

/* ROWS */
.row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin:16px;
}

/* HANDS */
#hand,
#opponentHand{
  display:flex;              /* 🔥 FIX */
  justify-content:center;   /* 🔥 FIX */
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  min-height:120px;
  width:100%;
  padding:10px;
}

/* CARDS */
.card{
  width:70px;
  transition:0.2s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.08);
}

/* DECKS */
#deck,
#discard{
  width:85px;
  height:110px;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  cursor:pointer;
  border-radius:8px;
}

/* BUTTONS */
button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

#restartBtn{
  display:none;
}

/* MOBILE */
@media(max-width:600px){

  .card{
    width:55px;
  }

  #deck,
  #discard{
    width:70px;
    height:95px;
  }

  #hand,
  #opponentHand{
    gap:6px;
  }
}

</style>
</head>

<body>

<div id="status"></div>

<div id="scores"></div>

<button id="restartBtn">
  Play Again
</button>

<!-- OPPONENT -->
<div id="opponentHand"></div>

<!-- CENTER -->
<div class="row">

  <div id="deck">
  <img
    src="/cards/back.png"
    class="card"
  >
</div>

  <div id="discard"></div>

</div>

<!-- PLAYER -->
<div id="hand"></div>

<!-- PENDING -->
<div id="pending"></div>

<!-- ACTIONS -->
<div class="row">
  <button id="ghouliesBtn">
    Call Ghoulies
  </button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
